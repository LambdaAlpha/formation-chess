[package]
name = "formation-chess-arena"
version = "0.3.4"
edition = "2024"
description = "Reproducible match scheduling and data collection for Formation Chess agents"
repository = "https://github.com/LambdaAlpha/formation-chess"
license = "MIT OR Apache-2.0"
keywords = ["board-game", "ai", "agent", "simulation", "statistics"]
categories = ["games", "simulation"]

[lints]
workspace = true

[dependencies]
formation-chess-core = { path = "../core", version = "0.3.4" }
formation-chess-agent = { path = "../agent", version = "0.3.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
