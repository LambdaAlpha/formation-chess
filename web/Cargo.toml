[package]
name = "formation-chess-web"
version = "0.2.0"
edition = "2024"
description = "Local browser interface and HTTP server for Formation Chess (阵棋)"
repository = "https://github.com/LambdaAlpha/formation-chess"
license = "MIT OR Apache-2.0"
keywords = ["board-game", "abstract-game", "chess", "xiangqi", "strategy"]
categories = ["games"]

[lints]
workspace = true

[dependencies]
formation-chess-core = { path = "../core", version = "0.2" }
formation-chess-agent = { path = "../agent", version = "0.2" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
rust-embed = "8"
